<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ペンライト</title>
<style>
  :root { --fade: 2s; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000;
    transition: background-color var(--fade) ease;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 28px; box-sizing: border-box;
    background: #000; color: #fff; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    opacity: 0; visibility: hidden;
    transition: opacity var(--fade) ease, visibility 0s linear var(--fade);
  }
  .screen.show {
    opacity: 1; visibility: visible;
    transition: opacity var(--fade) ease, visibility 0s;
  }
  .logo { max-width: 70vw; max-height: 32vh; margin-bottom: 36px; }
  .text { font-size: 17px; line-height: 1.9; max-width: 30em; }
  .text p { margin: 0 0 1em; }
  .text { transition: opacity .3s ease; }
  body:not(.ready) .text { opacity: 0; } /* スプシの文言が届くまで文字は出さない */
  .text { word-break: auto-phrase; } /* スプシの文言も、対応ブラウザでは文節で折り返す */
  .text strong { color: #FFD000; font-weight: 700; }
  .end .text { font-size: 19px; }
  #mock {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 10;
    display: none; flex-wrap: wrap; gap: 6px; justify-content: center;
    padding: 8px; border-radius: 10px; background: rgba(0,0,0,.6);
    touch-action: auto;
  }
  #mock button { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #888; background: #222; color: #fff; }
</style>
</head>
<body>

<!-- ① 開始画面 -->
<section id="start" class="screen show">
  <img class="logo" src="logo.png" alt="" onerror="this.remove()">
  <div class="text" id="startText">
    <p>本日はご来場、ありがとうございます。</p>
    <p><strong>3年生のエンディング</strong><br><strong>パフォーマンス</strong>の際、<br>MCの合図でこちらのサイトを<br>お開きください。</p>
    <p><strong>画面の明るさを最大</strong>にしていただき、<br>また、<strong>画面の自動オフの設定を解除</strong>し<br>本画面を開いたら、<br>そのままお待ちください。</p>
  </div>
</section>

<!-- ③ 終了画面 -->
<section id="end" class="screen end">
  <div class="text" id="endText">
    <p>本アプリの使用は<br>以上となります。</p>
    <p>お楽しみいただき、<br>ありがとうございました！</p>
  </div>
</section>

<!-- ?mock を付けたときだけ出るお試し操作パネル -->
<div id="mock"></div>

<script type="module">
  import { FIREBASE_CONFIG } from './config.js';

  const root = document.documentElement;
  const startEl = document.getElementById('start');
  const endEl = document.getElementById('end');
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  // ② 状態を画面に反映（mode: start / color / end）
  function apply(state) {
    const fade = Number(state.fade);
    root.style.setProperty('--fade', (isFinite(fade) && fade >= 0 ? fade : 2) + 's');

    const mode = state.mode || 'start';
    const color = mode === 'color' && /^#[0-9a-f]{6}$/i.test(state.color || '') ? state.color : '#000000';

    startEl.classList.toggle('show', mode === 'start');
    endEl.classList.toggle('show', mode === 'end');
    root.style.backgroundColor = color;
    document.body.style.backgroundColor = color;
    themeMeta.setAttribute('content', color);
  }

  // 基準の時計。端末の時計がズレていても全員が同じ時刻で動くよう、時刻サーバーとの差を測る。
  // 取れなければ端末の時計をそのまま使う
  const TIME_URL = 'https://time.akamai.com/?ms';
  const clock = { offset: 0, best: null };
  const serverNow = () => Date.now() + clock.offset;

  async function sampleClock() {
    const abort = new AbortController();
    const timeout = setTimeout(() => abort.abort(), 5000);
    try {
      const sentAt = Date.now();
      const res = await fetch(TIME_URL, { cache: 'no-store', signal: abort.signal });
      const server = parseFloat(await res.text()) * 1000;
      const receivedAt = Date.now();
      if (!isFinite(server)) throw new Error('bad time');
      return { rtt: receivedAt - sentAt, offset: server - (sentAt + receivedAt) / 2 };
    } finally {
      clearTimeout(timeout);
    }
  }

  // 往復が一番速かった測定が一番正確。前の測定と矛盾したら（端末の時計が動いたら）測り直した値を使う
  async function syncClock(samples) {
    for (let i = 0; i < samples; i++) {
      try {
        const s = await sampleClock();
        const b = clock.best;
        if (!b || s.rtt < b.rtt || Math.abs(s.offset - b.offset) > (s.rtt + b.rtt) / 2) clock.best = s;
      } catch (e) { break; }
    }
    const b = clock.best;
    if (b) clock.offset = Math.abs(b.offset) <= b.rtt / 2 ? 0 : b.offset; // 測定誤差の範囲なら端末の時計のまま
    render();
  }

  // スプシから届いた内容を画面へ。自動再生中は開始時刻からの経過で今の行を決める
  let remote = null;
  let shownKey = null;
  let timer = null;

  function showText() { document.body.classList.add('ready'); }
  setTimeout(showText, 5000); // 通信できないときは、ここに書いてある文言を出す

  function setRemote(data) {
    remote = data;
    // スプシで文言が入っていれば差し替え（空なら最初から書いてある文言のまま）
    if (data.startText) setText('startText', data.startText);
    if (data.endText) setText('endText', data.endText);
    showText();
    render();
  }

  function parseTimeline(json) {
    try { return JSON.parse(json || '[]'); } catch (e) { return []; }
  }

  function render() {
    clearTimeout(timer);
    if (!remote) return;
    const rows = parseTimeline(remote.timeline);
    const startAt = Number(remote.startAt) || 0;
    if (!startAt || !rows.length) {
      shownKey = null;
      apply(remote);
      return;
    }

    const elapsed = (serverNow() - startAt) / 1000;
    let index = -1;
    rows.forEach((row, i) => { if (row.t <= elapsed) index = i; });

    const key = startAt + ':' + index;
    if (key !== shownKey) {
      shownKey = key;
      if (index < 0) {
        apply(remote); // 開始前は B2 の表示のまま
      } else {
        // 途中から開いた・復帰した端末は、フェードの残り時間だけで追いつく
        const row = rows[index];
        apply({ mode: row.mode, color: row.color, fade: Math.max(0, row.fade - (elapsed - row.t)) });
      }
    }

    const next = rows[index + 1];
    if (next) timer = setTimeout(render, Math.min(Math.max(0, (next.t - elapsed) * 1000), 1000));
  }

  syncClock(5);
  setInterval(() => syncClock(2), 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncClock(2);
    render();
  });

  // 改行 → 改行、空行 → 段落、**ここ** → 黄色の太字
  function setText(id, text) {
    const esc = String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const html = esc.trim().split(/\n\s*\n/)
      .map(p => '<p>' + p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</p>')
      .join('');
    const el = document.getElementById(id);
    if (el.dataset.src !== html) { el.innerHTML = html; el.dataset.src = html; }
  }

  // 画面を消さない（対応端末のみ）。タップされたら全画面化も試す（Android）
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* 非対応・拒否時は何もしない */ }
  }
  document.addEventListener('visibilitychange', keepAwake);
  addEventListener('pointerdown', (e) => {
    keepAwake();
    if (e.target.closest('#mock')) return;
    if (!document.fullscreenElement && root.requestFullscreen) root.requestFullscreen().catch(() => {});
  }, { passive: true });
  keepAwake();

  const params = new URLSearchParams(location.search);

  if (params.has('mock')) {
    // GAS・Firebase につながずに見た目だけ試すモード
    const colors = ['#FF0033', '#FF7A00', '#FFE600', '#00D26A', '#00C8FF', '#2F5BFF', '#9B30FF', '#FF4FB8', '#FFFFFF'];
    const panel = document.getElementById('mock');
    panel.style.display = 'flex';
    const add = (label, state, bg) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (bg) { b.style.background = bg; b.style.color = '#000'; }
      b.onclick = () => setRemote({ fade: 2, ...state });
      panel.appendChild(b);
    };
    add('開始', { mode: 'start' });
    colors.forEach(c => add('　', { mode: 'color', color: c }, c));
    add('終了', { mode: 'end' });
    add('文言', { mode: 'start', startText: '3年生のエンディング\nパフォーマンスの際、\nMCの合図でこちらのサイトを\nお開きください。\n\n**画面の明るさを最大**にし、\n本画面を開いたら\nそのままお待ちください。（スプシ）' });
    add('自動', {});
    panel.lastChild.onclick = () => setRemote({
      mode: 'start', fade: 2, startAt: serverNow() + 2000,
      timeline: JSON.stringify([
        { t: 0, mode: 'color', color: '#FF0033', fade: 1 },
        { t: 3, mode: 'color', color: '#00C8FF', fade: 1 },
        { t: 6, mode: 'color', color: '#FFE600', fade: 0 },
        { t: 9, mode: 'end', color: '#000000', fade: 1 },
      ]),
    });
    window.penlight = { clock, setRemote };
    showText();
  } else {
    // Firestore の live/state を購読。スプシで変更されると数秒以内に届く
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(FIREBASE_CONFIG));
    onSnapshot(doc(db, 'live', 'state'),
      (snap) => { if (snap.exists()) setRemote(snap.data()); },
      (err) => console.error(err)); // 通信エラー時は今の画面のまま（SDK が自動で再接続）
  }
</script>
</body>
</html>
